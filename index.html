<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臨時人員工時管理系統 (2026 資料遷移版)</title>
    <!-- 使用 Tailwind CSS CDN -->
    <script src="assets/vendor/tailwindcss.js"></script>
    <!-- React 與 ReactDOM CDN -->
    <script src="assets/vendor/react.production.min.js"></script>
    <script src="assets/vendor/react-dom.production.min.js"></script>
    <!-- Lucide 圖示庫 -->
    <script src="assets/vendor/lucide.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif;
        }
        /* 列印專用樣式 */
        @media print {
            .print-hidden { display: none !important; }
            .sticky { position: static !important; }
            body { 
                background: white !important; 
                padding: 0 !important; 
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .shadow-2xl, .rounded-xl { box-shadow: none !important; border-radius: 0 !important; }
            table { 
                border-collapse: collapse !important; 
                width: 100% !important; 
                table-layout: fixed !important;
            }
            th, td { 
                border: 1px solid #000 !important; 
                color: black !important; 
                padding: 2px !important;
                height: 30px !important;
            }
            .print-text-center {
                display: block !important;
                text-align: center !important;
                font-weight: bold !important;
                font-size: 11px !important;
            }
            input { display: none !important; } 
            .text-red-600 { color: #dc2626 !important; }
            .bg-red-50 { background-color: #fef2f2 !important; }
            .w-name { width: 150px !important; }
            .w-total { width: 60px !important; }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>
    <script src="assets/app.js"></script>
</body>
</html>
